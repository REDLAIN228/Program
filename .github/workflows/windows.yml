name: Windows tests and desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Headless tests (does not validate native Win32 input)
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          if not exist artifacts mkdir artifacts
          python -m pytest -q --junitxml=artifacts/pytest-results.xml > artifacts/pytest-output.txt 2>&1
          exit /b %errorlevel%
      - name: Publish test diagnostics
        if: always()
        run: python tools/ci_summary.py artifacts/pytest-output.txt "$env:GITHUB_STEP_SUMMARY"
      - name: Build Windows desktop executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AnimeDrawer --icon assets/anime-drawer.ico --add-data "assets/size-digits.npz;assets" --collect-data cv2 --add-data "MODEL_NOTICES.md;." --collect-all mss --collect-all keyring --hidden-import keyring.backends.Windows main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeDrawer-Windows
          path: dist/AnimeDrawer/
