name: Windows tests and desktop build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Headless tests (does not validate native Win32 input)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build Windows desktop executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AnimeDrawer --icon assets/anime-drawer.ico --collect-all mss --collect-all keyring --hidden-import keyring.backends.Windows main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeDrawer-Windows
          path: dist/AnimeDrawer/
