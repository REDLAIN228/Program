name: Windows launcher checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - run.bat
      - bootstrap.py
      - requirements.txt
      - app/main.py
      - tools/gui_startup_smoke.py
      - tools/long_path_smoke.py
      - .github/workflows/launcher.yml
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      ANIME_DRAWER_NO_PAUSE: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: First launch installs dependencies
        run: call run.bat --install-only
      - name: Repair a partially installed environment
        run: |
          python -c "from pathlib import Path; import subprocess; p=Path('logs/python-path.txt').read_text(encoding='utf-8').strip(); subprocess.run([p,'-m','pip','uninstall','-y','mss'],check=True)"
          if errorlevel 1 exit /b 1
          call run.bat --install-only
          if errorlevel 1 exit /b 1
      - name: Repeated healthy launch
        run: call run.bat --install-only
      - name: Launch from nested GitHub ZIP folders
        run: python tools/long_path_smoke.py
      - name: Application errors retain their exit status and log
        run: |
          call run.bat --invalid-launcher-smoke-option
          if not "%errorlevel%"=="1" exit /b 1
          findstr /c:"unrecognized arguments" logs\startup.log >nul
          if errorlevel 1 exit /b 1
      - name: Desktop UI startup and Win32 hotkey initialization
        run: python -c "from pathlib import Path; import subprocess; p=Path('logs/python-path.txt').read_text(encoding='utf-8').strip(); subprocess.run([p,'tools/gui_startup_smoke.py'],check=True)"
